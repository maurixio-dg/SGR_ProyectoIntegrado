
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | SGR La Serena</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/municipal.css' %}">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-side-brand">
            <h2>Sistema de Gestión de Resultados</h2>
            <p>Municipalidad de La Serena</p>
        </div>

        <div class="login-form-area">
            <h3>Recuperar contraseña</h3>
            <p>Ingresa el correo asociado a tu cuenta.</p>

            <form method="post">
                {% csrf_token %}

                {% if form.email.errors %}
                    <div class="alert alert-danger">
                        {{ form.email.errors }}
                    </div>
                {% endif %}

                <div class="mb-4">
                    <label for="id_email" class="form-label fw-semibold">
                        Correo electrónico
                    </label>
                    <input
                        type="email"
                        name="email"
                        id="id_email"
                        class="form-control custom-input"
                        required
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="btn btn-login w-100">
                    Solicitar recuperación
                </button>
            </form>

            <div class="mt-3 text-center">
                <a href="{% url 'login' %}">
                    Volver al inicio de sesión
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
