
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña actualizada | SGR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/municipal.css' %}">
    <link rel="stylesheet" href="{% static 'css/sgr_recuperacion_institucional.css' %}?v=1">
</head>
<body class="sgr-recovery-page">
<div class="login-page">
    <div class="login-card">
        <div class="login-side-brand">
            <img src="{% static 'img/logo.png' %}" class="sgr-recovery-logo" width="65" height="65" alt="Emblema de La Serena">
            <h2>Sistema de Gestión de Resultados</h2>
            <p>Municipalidad de La Serena</p>
        </div>
        <div class="login-form-area">
            <h3>¡Contraseña actualizada!</h3>
            <p>
                Tu contraseña se ha restablecido correctamente.
                Ya puedes iniciar sesión con tu nueva contraseña.
            </p>

            <a href="{% url 'login' %}" class="btn btn-login w-100">
                Iniciar sesión
            </a>
        </div>
    </div>
</div>
</body>
</html>
